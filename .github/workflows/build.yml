name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn package
      - name: Upload built module
        uses: actions/upload-artifact@v4
        with:
          name: warecue-module
          path: |
            pkg/
            *.tgz
          if-no-files-found: error
          retention-days: 30
